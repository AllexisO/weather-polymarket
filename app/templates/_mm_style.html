<style>
  body:has(.bk) .main-col { background: #0A0A0B; }
  body:has(.bk) main { max-width: 1200px; }
  .bk { --bk-card: #1C1C1E; --bk-raise: #262628; --bk-line: #2E2E31; --bk-text: #F4F4F5; --bk-muted: #A1A1AA; --bk-faint: #71717A;
    --bk-accent: #FFD58A; --bk-accent-bg: rgba(255, 213, 138, .14); --bk-pos: #A3E39A; --bk-pos-bg: rgba(163, 227, 154, .13); --bk-neg: #F4A77F;
    --bk-font: "Onest", -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--bk-text); font-family: var(--bk-font); font-size: 15px; line-height: 1.55; }
  .bk .num { font-variant-numeric: tabular-nums; } .bk .pos { color: var(--bk-pos); } .bk .neg { color: var(--bk-neg); } .bk .muted { color: var(--bk-muted); }
  .bk a { color: var(--bk-accent); text-underline-offset: 3px; }
  .top h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .top h1 .tag { vertical-align: middle; margin-left: 8px; }
  .top p { margin: 6px 0 24px; color: var(--bk-muted); font-size: 14px; max-width: 820px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--bk-accent-bg); color: var(--bk-accent); }
  .sec { margin: 0 0 34px; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 12px; }
  .sec-head h2 { margin: 0; font-size: 19px; font-weight: 600; }
  .sec-head .aside { font-size: 13.5px; color: var(--bk-muted); }
  .pane { background: var(--bk-card); border: 1px solid var(--bk-line); border-radius: 16px; padding: 20px 22px; }
  .pane + .pane { margin-top: 14px; }
  .live { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 24px; align-items: start; }
  @media (max-width: 900px) { .live { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bk-faint); display: inline-block; margin-right: 8px; }
  .dot.on { background: var(--bk-pos); box-shadow: 0 0 0 0 rgba(163, 227, 154, .5); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(163, 227, 154, 0); } 100% { box-shadow: 0 0 0 0 rgba(163, 227, 154, 0); } }
  .live b { font-size: 18px; font-weight: 600; } .live span { font-size: 12.5px; color: var(--bk-muted); display: block; }
  .wal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .w h3 { margin: 0 0 2px; font-size: 16px; font-weight: 600; } .w .code { font: 500 11.5px ui-monospace, Menlo, Consolas, monospace; color: var(--bk-muted);
    border: 1px solid var(--bk-line); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  .w p { margin: 0 0 12px; font-size: 13px; color: var(--bk-muted); }
  .w .big { font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
  .w .sub { font-size: 13px; color: var(--bk-muted); margin-top: 2px; }
  .kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
  .kv div { background: var(--bk-raise); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .kv span { display: block; font-size: 11.5px; color: var(--bk-muted); } .kv b { font-size: 14.5px; font-weight: 600; }
  .chart { position: relative; } .chart svg.viz { width: 100%; height: auto; display: block; overflow: visible; }
  .viz .grid line { stroke: var(--bk-line); } .viz text { fill: var(--bk-muted); font-size: 12px; } .viz text.lab { fill: var(--bk-text); font-size: 12.5px; }
  .viz .ln { fill: none; stroke-width: 2.2; stroke-linejoin: round; } .viz .ln.s-model { stroke: #FFD58A; } .viz .ln.s-real { stroke: #A3E39A; }
  .viz .end { stroke: var(--bk-card); stroke-width: 2; } .viz .end.s-model { fill: #FFD58A; } .viz .end.s-real { fill: #A3E39A; }
  .viz .hit { fill: transparent; } .viz .cross { stroke: var(--bk-muted); opacity: 0; } .viz .live { stroke: none; }
  .bk table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .bk th { text-align: left; font-weight: 500; font-size: 12px; color: var(--bk-muted); padding: 0 10px 8px 0; border-bottom: 1px solid var(--bk-line); white-space: nowrap; }
  .bk td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--bk-line); } .bk tr:last-child td { border-bottom: 0; }
  .bk .r { text-align: right; } .scroll { overflow-x: auto; }
  .tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .tri .pane + .pane { margin-top: 0; }
  .tri h3, .pane h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
  .rules { margin: 0; padding-left: 20px; } .rules li { margin: 0 0 6px; font-size: 14px; color: var(--bk-muted); } .rules b { color: var(--bk-text); }
  .empty { color: var(--bk-muted); text-align: center; padding: 22px 8px; font-size: 14.5px; }
  .foot { margin: 10px 0 0; font-size: 13px; color: var(--bk-muted); max-width: 860px; }
  @media (max-width: 900px) { .wal, .tri { grid-template-columns: 1fr; } }
  @media (max-width: 600px) { .pane { padding: 16px; } .kv { grid-template-columns: 1fr 1fr; } }

  /* 01.10 (Alex): в каждой паре карточек цифры и плитки — на одной линии: описание забирает свободное место, остальное прижато вниз */
  .wal > .w { display: flex; flex-direction: column; margin-top: 0; }   /* «.pane + .pane» давал второй карточке отступ сверху — в сетке это сдвиг */
  .live > div { display: flex; flex-direction: column; justify-content: flex-start; }
  .live .st { display: flex; align-items: center; gap: 8px; }
  .live .dot { display: inline-block; margin: 0; flex: none; }
  .w p { flex: 1 1 auto; }
  .w .sub { min-height: 2.9em; }
  a.w { color: inherit; text-decoration: none; transition: border-color .15s, background .15s; }
  a.w:hover { border-color: var(--bk-accent); background: #202022; }
  a.w .open { font-size: 12.5px; color: var(--bk-accent); margin-left: auto; white-space: nowrap; }
  .w .head { display: flex; align-items: baseline; gap: 8px; }
  .upd { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; font-size: 12px; color: var(--bk-faint); }
  .upd b { color: var(--bk-muted); font-weight: 500; }
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 13.5px; color: var(--bk-muted); }
  .pager a { padding: 4px 10px; border: 1px solid var(--bk-line); border-radius: 8px; text-decoration: none; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .tabs a { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--bk-line); color: var(--bk-muted); text-decoration: none; font-size: 13.5px; }
  .tabs a.on { background: var(--bk-accent-bg); color: var(--bk-accent); border-color: transparent; }
  .back { display: inline-block; margin-bottom: 10px; font-size: 13.5px; }
</style>
