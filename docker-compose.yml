services:
  # Не постоянно работающий сервис — вызывается по крону (см. README):
  # docker compose run --rm collector weather_edge.py
  collector:
    build: .
    container_name: polymarket-lab-collector
    env_file: .env
    volumes:
      - ./app:/app
      - ./data:/data
    environment:
      TZ: Europe/Chisinau
      POLY_LAB_DB: /data/db/polymarket_lab.sqlite3
    profiles:
      - cli

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: polymarket-lab-dashboard
    restart: unless-stopped
    volumes:
      - ./app:/app
      - ./data:/data
    environment:
      TZ: Europe/Chisinau
      POLY_LAB_DB: /data/db/polymarket_lab.sqlite3
    ports:
      - "8093:8093"
